name: Feature request
description: Suggest an improvement to DeepSec.run.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the problem or workflow this would improve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would a good solution look like?
    validations:
      required: false
